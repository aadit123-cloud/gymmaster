<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Fitness Management System</title>
    <link rel="stylesheet" href="fitness.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="logo.png" alt="GymMaster Logo">
            <h1>GYMMASTER</h1>
        </div>
        <nav>
            <ul>
                <li><a href="fitness.html">Home</a></li>
                <li><a href="#features">Features &#9662;</a>
                    <ul class="dropdown">
                        <li><a href="dietplan.html">Diet Plan</a></li>
                        <li><a href="membershipmanagement.html">Membership Management</a></li>
                        <li><a href="creatin.html">Creatine Shop Address</a></li>
                    </ul>
                </li>
                <li><a href="pricing.html">Pricing</a></li>
                <li><a href="support.html">Support</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="fitness_login.html">Login</a></li>
                <li><a href="#get-started" class="button">Get Started</a></li>
            </ul>
        </nav>
    </header>

    <section id="login-section">
        <div class="login-container">
            <h2>Login</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username:</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit">Login</button>
            </form>
            <div class="signup-link">
                <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2025 Fitness Management System</p>
    </footer>

    <script src="login.js"></script>
</body>
</html>
