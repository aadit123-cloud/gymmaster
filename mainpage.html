<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Management System - Main</title>
    <link rel="stylesheet" href="fitness.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="logo.png" alt="GymMaster Logo">
            <h1>GYMMASTER</h1>
        </div>
        <nav>
            <ul>
                <li><a href="#features">Features &#9662;</a>
                    <ul class="dropdown">
                        <li><a href="dietplan.html">Diet Plan</a></li>
                        <li><a href="membershipmanagement.html">Membership Management</a></li>
                        <li><a href="creatin.html">Creatine Shop Address</a></li>
                    </ul>

            </ul>
        </nav>
    </header>

    <section id="bmi-calculator">
        <div class="bmi-container">
            <h2>BMI Calculator</h2>
            <form id="bmi-form">
                <div class="form-group">
                    <label for="height">Height (cm):</label>
                    <input type="number" id="height" name="height" required>
                </div>
                <div class="form-group">
                    <label for="weight">Weight (kg):</label>
                    <input type="number" id="weight" name="weight" required>
                </div>
                <div class="form-group">
                    <label for="gender">Gender:</label>
                    <select id="gender" name="gender">
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <button type="submit">Calculate BMI</button>
            </form>
            <div id="bmi-result" class="bmi-result">
                <!-- BMI Result will be displayed here -->
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2025 Fitness Management System</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
